[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/generated/**", "**/migrations/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend", "ml"]
addopts = "-ra --strict-markers --import-mode=importlib"
