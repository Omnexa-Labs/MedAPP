<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join MedApp Network</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                extend: {

                        "inverse-on-surface": "#edf2f0",
                        "tertiary-fixed-dim": "#adc6ff",

                        "surface-container-high": "#e4e9e7",

                        "primary": "#00685f",
                        "on-secondary-container": "#57657a",
                        "surface-container-highest": "#dee4e1",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-variant": "#dee4e1",
                        "secondary-fixed": "#d5e3fc",
                        "outline-variant": "#bcc9c6",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#2170e4",
                        "inverse-primary": "#6bd8cb",
                        "surface-tint": "#006a61",
                        "on-primary-fixed": "#00201d",
                        "secondary-fixed-dim": "#b9c7df",
                        "surface-container-low": "#f0f5f2",
                        "surface": "#f5faf8",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2c3130",
                        "surface-container": "#eaefed",
                        "tertiary-fixed": "#d8e2ff",
                        "on-secondary-fixed-variant": "#3a485b",
                        "on-tertiary-fixed-variant": "#004395",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "80px",
                        "lg": "48px",
                        "container-max": "1280px",
                        "gutter": "24px",
                        "base": "8px",
                        "sm": "12px",
                        "xs": "4px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-lg": ["Manrope"],

                        "headline-md": ["Manrope"],
                        "body-md": ["Inter"],

                    "fontSize": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md bg-surface dark:bg-surface-dim shadow-[0px_4px_20px_rgba(71,85,105,0.05)] shadow-sm">
<div class="max-w-7xl mx-auto flex justify-between items-center h-16 px-gutter md:px-lg">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">MedApp Partner</span>
</div>
<nav class="hidden md:flex gap-md h-full items-center">
<!-- Navigation logic not applicable to this transactional screen, keeping empty for shell structure -->
</nav>
<div class="flex items-center">
<!-- Placeholder for avatar or secondary actions if needed, though usually empty on a signup/join screen -->
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[104px] pb-xl px-gutter md:px-lg max-w-container-max mx-auto w-full flex flex-col items-center justify-center">
<!-- Hero Section -->
<div class="text-center max-w-3xl mb-lg">
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-sm hidden md:block">Join the MedApp Network</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm md:hidden">Join the MedApp Network</h1>
<p class="font-body-lg text-body-lg text-secondary">
                Select your provider profile to explore tailored tools, expand your patient reach, and streamline your clinical operations.
            </p>
</div>
<!-- Bento Grid / Card Layout -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-md w-full max-w-6xl">
<!-- Card 1: Pharmacy -->
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="provider_type" type="radio" value="pharmacy"/>
<div class="h-full bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(71,85,105,0.05)] border border-surface-variant p-md flex flex-col items-start transition-all duration-300 hover:shadow-[0px_10px_30px_rgba(71,85,105,0.1)] hover:-translate-y-1 peer-checked:border-primary peer-checked:ring-2 peer-checked:ring-primary peer-checked:bg-surface-bright">
<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center mb-md group-hover:bg-primary-container/30 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">local_pharmacy</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Pharmacy</h2>
<p class="font-body-md text-body-md text-secondary mb-md flex-grow">
                        Expand your reach and manage prescriptions with seamless digital integration. Connect with more patients locally.
                    </p>
<div class="flex items-center text-primary font-label-md text-label-md">
<span>Select Pharmacy</span>
<span class="material-symbols-outlined ml-xs text-lg opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all peer-checked:opacity-100 peer-checked:translate-x-0">arrow_forward</span>
</div>
<div class="absolute top-4 right-4 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Card 2: Hospital/Clinic -->
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="provider_type" type="radio" value="hospital"/>
<div class="h-full bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(71,85,105,0.05)] border border-surface-variant p-md flex flex-col items-start transition-all duration-300 hover:shadow-[0px_10px_30px_rgba(71,85,105,0.1)] hover:-translate-y-1 peer-checked:border-primary peer-checked:ring-2 peer-checked:ring-primary peer-checked:bg-surface-bright">
<div class="w-16 h-16 rounded-full bg-tertiary-container/20 flex items-center justify-center mb-md group-hover:bg-tertiary-container/30 transition-colors">
<span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 1;">local_hospital</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Hospital or Clinic</h2>
<p class="font-body-md text-body-md text-secondary mb-md flex-grow">
                        Streamline operations, optimize patient intake, and coordinate care across departments with enterprise-grade tools.
                    </p>
<div class="flex items-center text-primary font-label-md text-label-md">
<span>Select Facility</span>
<span class="material-symbols-outlined ml-xs text-lg opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all peer-checked:opacity-100 peer-checked:translate-x-0">arrow_forward</span>
</div>
<div class="absolute top-4 right-4 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Card 3: Individual Practitioner -->
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="provider_type" type="radio" value="individual"/>
<div class="h-full bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(71,85,105,0.05)] border border-surface-variant p-md flex flex-col items-start transition-all duration-300 hover:shadow-[0px_10px_30px_rgba(71,85,105,0.1)] hover:-translate-y-1 peer-checked:border-primary peer-checked:ring-2 peer-checked:ring-primary peer-checked:bg-surface-bright">
<div class="w-16 h-16 rounded-full bg-secondary-container/30 flex items-center justify-center mb-md group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined text-secondary text-3xl" style="font-variation-settings: 'FILL' 1;">stethoscope</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Individual Practitioner</h2>
<p class="font-body-md text-body-md text-secondary mb-md flex-grow">
                        Focus on care delivery while we handle scheduling, billing, and telehealth infrastructure. Maintain clinical autonomy.
                    </p>
<div class="flex items-center text-primary font-label-md text-label-md">
<span>Select Practitioner</span>
<span class="material-symbols-outlined ml-xs text-lg opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all peer-checked:opacity-100 peer-checked:translate-x-0">arrow_forward</span>
</div>
<div class="absolute top-4 right-4 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
</div>
<!-- Action Area -->
<div class="mt-lg flex flex-col items-center">
<button class="bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md py-3 px-8 rounded-full shadow-md hover:shadow-lg transition-all duration-200 min-w-[200px]">
                Get Started
            </button>
<p class="mt-sm font-label-sm text-label-sm text-secondary">
                Already part of the network? <a class="text-primary hover:underline" href="#">Sign In</a>
</p>
</div>
</main>
</body></html>
