<body class="antialiased text-on-surface">
<main class="relative h-screen w-full flex flex-col items-center justify-between overflow-hidden splash-gradient">
<!-- Top Decorative Element -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-container-max px-gutter pt-xl opacity-20 pointer-events-none">
<div class="w-64 h-64 bg-primary/10 rounded-full blur-3xl mx-auto"></div>
</div>
<!-- Center Branding Section -->
<div class="flex-1 flex flex-col items-center justify-center z-10">
<div class="mb-md p-lg rounded-[32px] bg-white shadow-[0px_4px_20px_rgba(71,85,105,0.05)] border border-outline-variant/30">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="health_and_safety" data-weight="fill" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
<div class="text-center">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">MedApp</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm max-w-[280px]">Personalized care for a modern world.</p>
</div>
</div>
<!-- Bottom Action Section -->
<div class="w-full max-w-[400px] px-gutter pb-xl z-10">
<div class="flex flex-col items-center space-y-md">
<button class="w-full py-4 px-lg bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-lg hover:bg-primary-container active:scale-95 transition-all duration-200 flex items-center justify-center gap-base group">
                    Get Started
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="font-label-sm text-label-sm text-outline">
                    Trusted by 2M+ medical professionals
                </p>
</div>
</div>
