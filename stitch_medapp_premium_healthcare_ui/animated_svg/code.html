<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_177 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_177" style="display:block;"><svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="140%" id="glow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="3"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<!-- Outer Ring Background -->
<circle cx="100" cy="100" fill="none" r="80" stroke="#f0f5f2" stroke-width="12"></circle>
<!-- Success Ring -->
<circle cx="100" cy="100" fill="none" r="80" stroke="#0d9488" stroke-dasharray="502.65" stroke-linecap="round" stroke-width="12">
<animate attributename="stroke-dashoffset" calcmode="spline" dur="0.8s" fill="freeze" from="502.65" keysplines="0.4, 0, 0.2, 1" to="0"></animate>
</circle>
<!-- Pulse Effect -->
<circle cx="100" cy="100" fill="none" opacity="0" r="80" stroke="#0d9488" stroke-width="12">
<animate attributename="r" dur="1.5s" from="80" repeatcount="indefinite" to="95"></animate>
<animate attributename="opacity" dur="1.5s" repeatcount="indefinite" values="0;0.4;0"></animate>
<animate attributename="stroke-width" dur="1.5s" from="12" repeatcount="indefinite" to="0"></animate>
</circle>
<!-- Checkmark Background Circle -->
<circle cx="100" cy="100" fill="#0d9488" opacity="0" r="45">
<animate attributename="opacity" begin="0.8s" dur="0.3s" fill="freeze" from="0" to="1"></animate>
<animate attributename="r" begin="0.8s" calcmode="spline" dur="0.5s" fill="freeze" keysplines="0.175, 0.885, 0.32, 1.275" values="0;50;45"></animate>
</circle>
<!-- Checkmark -->
<path d="M70 100 L90 120 L130 80" fill="none" stroke="white" stroke-dasharray="100" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
<animate attributename="stroke-dashoffset" begin="1.1s" dur="0.4s" fill="freeze" from="100" to="0"></animate>
</path>
<!-- Particles -->
<g filter="url(#glow)">
<circle cx="100" cy="100" fill="#0d9488" r="2">
<animate attributename="cx" begin="1s" dur="1s" fill="freeze" values="100;140"></animate>
<animate attributename="cy" begin="1s" dur="1s" fill="freeze" values="100;60"></animate>
<animate attributename="opacity" begin="1s" dur="1s" fill="freeze" values="1;0"></animate>
</circle>
<circle cx="100" cy="100" fill="#0d9488" r="2">
<animate attributename="cx" begin="1s" dur="1s" fill="freeze" values="100;60"></animate>
<animate attributename="cy" begin="1s" dur="1s" fill="freeze" values="100;60"></animate>
<animate attributename="opacity" begin="1s" dur="1s" fill="freeze" values="1;0"></animate>
</circle>
<circle cx="100" cy="100" fill="#0d9488" r="2">
<animate attributename="cx" begin="1s" dur="1s" fill="freeze" values="100;140"></animate>
<animate attributename="cy" begin="1s" dur="1s" fill="freeze" values="100;140"></animate>
<animate attributename="opacity" begin="1s" dur="1s" fill="freeze" values="1;0"></animate>
</circle>
<circle cx="100" cy="100" fill="#0d9488" r="2">
<animate attributename="cx" begin="1s" dur="1s" fill="freeze" values="100;60"></animate>
<animate attributename="cy" begin="1s" dur="1s" fill="freeze" values="100;140"></animate>
<animate attributename="opacity" begin="1s" dur="1s" fill="freeze" values="1;0"></animate>
</circle>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_177 -->
</body>
</html>
