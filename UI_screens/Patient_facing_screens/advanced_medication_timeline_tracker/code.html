<script>
        // Simple Interaction logic for "Log Dose" buttons
        document.querySelectorAll('button').forEach(btn => {
            if(btn.innerText === 'Log Dose') {
                btn.addEventListener('click', function() {
                    this.innerHTML = '<span class="material-symbols-outlined">check</span> Done';
                    this.classList.replace('bg-primary', 'bg-clinical-success');
                    // Add micro-interaction success feel
                    this.parentElement.parentElement.classList.add('scale-[0.98]', 'opacity-80');
                    setTimeout(() => {
                        this.parentElement.parentElement.classList.remove('scale-[0.98]');
                    }, 200);
                });
            }
        });
    </script>
