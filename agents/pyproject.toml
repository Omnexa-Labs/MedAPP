[project]
name = "medapp-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "tenacity>=9.0",
]

[project.optional-dependencies]
# Pick exactly one when you choose a provider. None are installed by default.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
google = ["google-generativeai>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
