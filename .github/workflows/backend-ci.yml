name: backend-ci

# Backend per-service test + lint matrix.
#
# NOTE: the matrix is currently a hardcoded list and does not include
# hms_service / pms_service / onboarding_service / wearable_sync_service —
# slice 4 of the CI/CD rollout replaces this with a change-detection matrix
# (only run for services whose paths changed in the PR).

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway
          - user_service
          - doctor_service
          - nurse_service
          - hospital_service
          - booking_service
          - payment_service
          - telemedicine_service
          - notification_service
          - lab_service
          - ehr_service
          - social_service
          - analytics_service
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          uv pip install --system ./backend/shared
          uv pip install --system ./backend/services/${{ matrix.service }}
          uv pip install --system pytest httpx
      - name: Lint
        run: uv run ruff check backend/services/${{ matrix.service }}
      - name: Test
        working-directory: backend/services/${{ matrix.service }}
        run: pytest -q
