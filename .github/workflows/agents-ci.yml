name: agents-ci

on:
  push:
    paths: ["agents/**"]
  pull_request:
    paths: ["agents/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - concierge_agent
          - smart_recommend_agent
          - medical_chat_agent
          - lab_reader_agent
          - vitals_watcher_agent
          - booking_agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          uv pip install --system ./agents
          uv pip install --system pytest httpx
      - name: Test
        working-directory: agents/services/${{ matrix.agent }}
        env:
          ANTHROPIC_API_KEY: dummy
          PYTHONPATH: ${{ github.workspace }}/agents:${{ github.workspace }}/agents/services/${{ matrix.agent }}
        run: pytest -q
