{{/*
Per-service ExternalSecret. Pulls `medapp-<env>-<kname>` from Google
Secret Manager (via the ClusterSecretStore installed by the platform
chart) and projects it into a K8s Secret named after the service.

`dataFrom.extract` expects the GSM secret payload to be a JSON object
(e.g. `{"DATABASE_URL": "...", "JWT_SECRET": "..."}`). Each top-level
key becomes an env var on the pod via the Deployment's envFrom.

Gated by `.Values.externalSecrets.enabled` because the ExternalSecret
CRD doesn't exist until the platform chart's ESO install runs. Flip
the flag after that one-time install. See infra/helm/platform/README.md.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- range $name, $cfg := .Values.services }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "medapp.kname" $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "medapp.labels" (dict "serviceName" $name "root" $) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecrets.storeName }}
  target:
    name: {{ include "medapp.kname" $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        # Matches `medapp-<env>-<service>` created by the Terraform
        # secret_manager module. Underscores normalised to hyphens to
        # match the GSM secret id.
        key: medapp-{{ $.Values.env }}-{{ include "medapp.kname" $name }}
{{- end }}
{{- end }}
