{{/*
Per-service ServiceAccount with the Workload Identity annotation.

The GSA email is derived deterministically from the service key + the
chart's projectId — it has to match the GSA created by the Terraform
`service_identity` module exactly. Hard-coding the pattern here means
operators don't have to feed 19 --set flags into helm.

   service_key:  user_service
   ksa name:     user-service
   GSA email:    user-service-wi@<projectId>.iam.gserviceaccount.com

If a service overrides .Values.services.<name>.gsa, that wins — useful
when a service needs to impersonate an external GSA in a different
project (e.g. shared analytics warehouse).
*/}}
{{- range $name, $cfg := .Values.services }}
{{- $defaultGsa := printf "%s-wi@%s.iam.gserviceaccount.com" (include "medapp.kname" $name) $.Values.projectId -}}
{{- $gsa := default $defaultGsa $cfg.gsa -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "medapp.kname" $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "medapp.labels" (dict "serviceName" $name "root" $) | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $gsa | quote }}
{{- end }}
