{{/*
K8s ServiceAccount in the medapp namespace that ESO's ClusterSecretStore
impersonates. Bound via Workload Identity to the GSM-reader GSA.

This is the per-namespace SA — ESO's controller runs in its own
external-secrets namespace under `external-secrets-controller`, then
uses this SA via `referentAuth` when resolving a request from the
medapp namespace.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecretsAuth.ksaName }}
  namespace: {{ .Values.namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.externalSecretsAuth.gsaEmail | quote }}
