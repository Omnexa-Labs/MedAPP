{{/*
ClusterSecretStore — ESO's connection to Google Secret Manager.

Auth uses Workload Identity: the reader-serviceaccount (in the medapp
namespace) is annotated with the GSM-reader GSA email. ESO impersonates
that SA when resolving each ExternalSecret.

`projectID` pins the GSM lookups to this env's project — even if a
ClusterSecretStore is cluster-wide, GSM lookups stay scoped to the
right project.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectId }}
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: medapp-{{ trimPrefix "medapp-" .Values.namespace }}
          serviceAccountRef:
            name: {{ .Values.externalSecretsAuth.ksaName }}
            namespace: {{ .Values.namespace }}
