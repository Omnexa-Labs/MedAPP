apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment_service
  labels: { app: payment_service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment_service }
  template:
    metadata:
      labels: { app: payment_service }
    spec:
      serviceAccountName: payment_service
      containers:
        - name: app
          image: REPLACE_IMAGE_REF
          ports: [{ containerPort: 8006 }]
          envFrom:
            - configMapRef: { name: medapp-config }
            - secretRef: { name: medapp-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8006 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8006 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment_service
spec:
  selector: { app: payment_service }
  ports:
    - port: 8006
      targetPort: 8006
