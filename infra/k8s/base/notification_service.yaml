apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification_service
  labels: { app: notification_service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: notification_service }
  template:
    metadata:
      labels: { app: notification_service }
    spec:
      serviceAccountName: notification_service
      containers:
        - name: app
          image: REPLACE_IMAGE_REF
          ports: [{ containerPort: 8008 }]
          envFrom:
            - configMapRef: { name: medapp-config }
            - secretRef: { name: medapp-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8008 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8008 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification_service
spec:
  selector: { app: notification_service }
  ports:
    - port: 8008
      targetPort: 8008
