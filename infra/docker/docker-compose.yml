name: medapp

x-py-build: &py-build
  context: ../..
  dockerfile: backend/Dockerfile

x-svc-env: &svc-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  # Allow any localhost / loopback port in dev (Expo web, Vite, CRA, etc.).
  # Override with GW_CORS_ORIGINS (explicit list) in production.
  GW_CORS_ORIGIN_REGEX: "http://(localhost|127\\.0\\.0\\.1):\\d+"
  # Shared secret for development across all services.
  JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  # doctor_service and booking_service use `shared.auth.get_current_principal`
  # as-is instead of overriding it in their own `app/deps.py` (unlike the
  # twelve services that do). That shared dependency reads its secret from
  # MEDAPP_DEFAULT_JWT_SECRET and returns 503 "auth not configured" when it
  # is unset — which is what every authenticated /v1/doctors and
  # /v1/bookings call was doing. Set it here so the dev stack works;
  # the real fix is for those two services to own their JWT config the
  # way the others do.
  MEDAPP_DEFAULT_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  MEDAPP_DEFAULT_JWT_AUDIENCE: "medapp.platform"
  MEDAPP_DEFAULT_JWT_ISSUER: "medapp"
  GW_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  USER_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  DOCTOR_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  NURSE_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  HOSPITAL_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  BOOKING_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  PAYMENT_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  TELEMEDICINE_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  NOTIFICATION_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  LAB_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  EHR_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  INBOX_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  SOCIAL_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  ANALYTICS_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  ONBOARDING_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  WEARABLE_SYNC_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  PHARMACY_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  PHARMACIST_JWT_SECRET: "medapp_dev_secret_jwt_key_32_chars_long"
  # Shared HMAC secret used by:
  #   - pharmacy_service to SIGN outbound stock-availability calls
  #     (PHARMACY_MEDAPP_PARTNER_SECRET)
  #   - pms_service to VERIFY those calls
  #     (PMS_MEDAPP_WEBHOOK_SECRET, same trust anchor for the partner
  #     path and the prescription webhook in dev)
  # Both env vars MUST resolve to the same string or the contract
  # breaks. Override with PMS_MEDAPP_WEBHOOK_SECRET in .env for real
  # deployments; the per-pharmacy `pms_partner_secret_id` lookup is
  # the production path.
  PHARMACY_MEDAPP_PARTNER_SECRET: "medapp_dev_partner_secret_change_me"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medapp
      POSTGRES_PASSWORD: medapp
      POSTGRES_DB: medapp
    ports: ["5432:5432"]
    # The init script runs ONCE the first time the pgdata volume is
    # empty. It creates the per-service databases (medapp_pms,
    # medapp_pharmacies, etc.). If you add a new service DB, you must
    # either run a one-off CREATE DATABASE against the live container
    # OR `docker compose down -v` to wipe the volume and let the
    # script run again. See `postgres-init.sql` for the canonical list.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-medapp-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: medapp
      MONGO_INITDB_ROOT_PASSWORD: medapp
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: medapp
      RABBITMQ_DEFAULT_PASS: medapp
    ports: ["5672:5672", "15672:15672"]
    # Nothing could wait on the broker being READY before this existed, which is
    # why `condition: service_started` was the best any service could do - and
    # service_started only means the container process launched, not that AMQP
    # is accepting. That gap is the startup race: user_service won it, its
    # connect failed, app.state.event_bus stayed None, and publish() silently
    # no-opped for the life of the process.
    healthcheck:
      # `ping` is NOT enough and was measured to be wrong here: it only asks
      # whether the Erlang node answers, which happens BEFORE the AMQP listener
      # binds. With ping, compose reported healthy and user_service still got
      # ECONNREFUSED on a cold start - the race survived the fix.
      #
      # `check_port_connectivity` tests the listener the clients actually dial.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./otel-config.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]

  api_gateway:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: api_gateway
        SERVICE_PORT: 8000
    depends_on: [user_service]
    environment: *svc-env
    ports: ["8000:8000"]

  user_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: user_service
        SERVICE_PORT: 8001
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    environment: *svc-env
    ports: ["8001:8001"]

  doctor_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: doctor_service
        SERVICE_PORT: 8002
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8002:8002"]

  nurse_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: nurse_service
        SERVICE_PORT: 8003
    depends_on: [postgres]
    environment: *svc-env
    ports: ["8003:8003"]

  hospital_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: hospital_service
        SERVICE_PORT: 8004
    depends_on: [postgres]
    environment: *svc-env
    ports: ["8004:8004"]

  booking_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: booking_service
        SERVICE_PORT: 8005
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8005:8005"]

  payment_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: payment_service
        SERVICE_PORT: 8006
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8006:8006"]

  telemedicine_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: telemedicine_service
        SERVICE_PORT: 8007
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8007:8007"]

  notification_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: notification_service
        SERVICE_PORT: 8008
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8008:8008"]

  inbox_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: inbox_service
        SERVICE_PORT: 8013
    depends_on: [postgres]
    environment: *svc-env
    ports: ["8013:8013"]
    # ATTACHMENT BYTES. Message attachments (voice notes, images, PDFs) are
    # written to a directory, not to Postgres — see
    # `backend/services/inbox_service/app/storage.py` for the choice and its
    # limits. Without this named volume the files live in the container's
    # writable layer and every `docker compose up --build` silently destroys
    # every attachment ever uploaded.
    #
    # MOUNTED AT /app/var, **NOT** AT /app/var/attachments. This looks like a
    # cosmetic difference and is not — it was found live, and the first version
    # of this line 500'd every single upload with:
    #
    #   PermissionError: [Errno 13] Permission denied:
    #   '/app/var/attachments/<thread-id>'
    #
    # Docker seeds an empty named volume from the image's contents at the
    # mount path, INCLUDING ownership — but only if that path exists in the
    # image. `backend/Dockerfile` creates and chowns `/app/var` to 10001;
    # `/app/var/attachments` does not exist there, so mounting the volume at
    # the deeper path made Docker create the directory itself, as root:root
    # 0755. The container runs as UID 10001 (Pod Security `restricted`), so it
    # could read that directory and never write to it.
    #
    # Mounting one level up at `/app/var` seeds the volume from a directory
    # that DOES exist and IS owned by 10001, and the service then creates
    # `attachments/` inside it with mode 0700. No Dockerfile change, no
    # root-owned mount, no init container.
    #
    # A named volume rather than a bind mount, for the same ownership reason:
    # a bind mount from a Windows or macOS host lands root-owned and puts the
    # bug straight back.
    #
    # NOT SHARED BETWEEN REPLICAS. This service cannot be scaled horizontally
    # while local storage is in use.
    volumes:
      - inbox_attachments:/app/var

  # ADDED 2026-08-07. This service exists on disk and IS routed by the gateway
  # (`/v1/onboarding` -> onboarding_service:8013), but had no container at all,
  # so every partner-onboarding call failed at DNS inside the compose network.
  # It was the only one of the 20 services with no compose entry.
  #
  # Host port 8022 rather than 8013: inbox_service already publishes 8013, and
  # they share an INTERNAL port harmlessly because the hostnames differ.
  onboarding_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: onboarding_service
        SERVICE_PORT: 8013
    depends_on:
      postgres:
        condition: service_healthy
    environment: *svc-env
    ports: ["8022:8013"]

  lab_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: lab_service
        SERVICE_PORT: 8009
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8009:8009"]

  ehr_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: ehr_service
        SERVICE_PORT: 8010
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8010:8010"]

  wearable_sync_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: wearable_sync_service
        SERVICE_PORT: 8014
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8014:8014"]

  social_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: social_service
        SERVICE_PORT: 8011
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *svc-env
    ports: ["8011:8011"]

  analytics_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: analytics_service
        SERVICE_PORT: 8012
    depends_on: [postgres]
    environment: *svc-env
    ports: ["8012:8012"]

  hms_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: hms_service
        SERVICE_PORT: 8020
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      HMS_MGMT_DATABASE_URL: postgresql+asyncpg://medapp:medapp@postgres/medapp_hms_mgmt
      HMS_TENANT_DATABASE_URL_TEMPLATE: postgresql+asyncpg://medapp:medapp@postgres/hms_{tenant_slug}
      HMS_ADMIN_DATABASE_URL_SYNC: postgresql://medapp:medapp@postgres/medapp
      HMS_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HMS_AMQP_URL: amqp://medapp:medapp@rabbitmq/
    ports: ["8020:8020"]

  pms_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: pms_service
        SERVICE_PORT: 8030
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PMS_DATABASE_URL: postgresql+asyncpg://medapp:medapp@postgres/medapp_pms
      PMS_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # The webhook secret doubles as the partner-token secret used by
      # pharmacy_service for stock-availability calls. Keep this in
      # lockstep with PHARMACY_MEDAPP_PARTNER_SECRET above.
      PMS_MEDAPP_WEBHOOK_SECRET: ${PMS_MEDAPP_WEBHOOK_SECRET:-medapp_dev_partner_secret_change_me}
      PMS_MEDAPP_DISPENSE_WEBHOOK_URL: ${PMS_MEDAPP_DISPENSE_WEBHOOK_URL:-}
    ports: ["8030:8030"]

  pharmacy_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: pharmacy_service
        SERVICE_PORT: 8015
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    environment:
      <<: *svc-env
      PHARMACY_DATABASE_URL: postgresql+asyncpg://medapp:medapp@postgres/medapp_pharmacies
    ports: ["8015:8015"]

  pharmacist_service:
    build:
      <<: *py-build
      dockerfile: backend/Dockerfile
      args:
        SERVICE: pharmacist_service
        SERVICE_PORT: 8016
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    environment:
      <<: *svc-env
      PHARMACIST_DATABASE_URL: postgresql+asyncpg://medapp:medapp@postgres/medapp_pharmacists
    ports: ["8016:8016"]

  pms_web:
    build:
      context: ../../frontend/pms_web
      dockerfile: Dockerfile
    depends_on: [pms_service]
    environment:
      NEXT_PUBLIC_PMS_API_URL: ${PMS_PUBLIC_API_URL:-http://localhost:8030}
    ports: ["3002:3000"]

  # ── Agents (Claude-powered) ────────────────────────────────────────────────
  concierge_agent:
    build: { <<: *py-build, dockerfile: agents/services/concierge_agent/Dockerfile }
    depends_on: [api_gateway]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["9001:9001"]

  smart_recommend_agent:
    build: { <<: *py-build, dockerfile: agents/services/smart_recommend_agent/Dockerfile }
    depends_on: [ehr_service]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["9002:9002"]

  medical_chat_agent:
    build: { <<: *py-build, dockerfile: agents/services/medical_chat_agent/Dockerfile }
    depends_on: [ehr_service]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["9003:9003"]

  lab_reader_agent:
    build: { <<: *py-build, dockerfile: agents/services/lab_reader_agent/Dockerfile }
    depends_on: [ehr_service, lab_service]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["9004:9004"]

  vitals_watcher_agent:
    build: { <<: *py-build, dockerfile: agents/services/vitals_watcher_agent/Dockerfile }
    depends_on: [ehr_service, notification_service]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["9005:9005"]

  booking_agent:
    build: { <<: *py-build, dockerfile: agents/services/booking_agent/Dockerfile }
    depends_on: [booking_service, payment_service]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["9006:9006"]

volumes:
  pgdata:
  mongodata:
  qdrantdata:
  # inbox_service message attachments. `docker compose down -v` DELETES PATIENT
  # FILES from here — the database backup does not contain them.
  inbox_attachments:
