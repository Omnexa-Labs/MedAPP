name: medapp
description: MedApp — global telemedicine and health platform.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  flutter_webrtc: ^0.11.6
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  sentry_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
