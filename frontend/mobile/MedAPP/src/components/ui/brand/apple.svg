<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 1000" width="814" height="1000" role="img">
  <!--
    Apple mark — the real silhouette. MaterialIcons' "apple" glyph is a generic
    fruit-with-leaf shape, not Apple's logo, which is why the Apple button read
    as wrong next to the Google one.

    Unlike the Google mark this one is MONOCHROME by specification, so it uses
    `currentColor` and takes its colour from the `color` prop that
    react-native-svg maps onto it — i.e. it flows through the token system
    (`on-surface` by default) and flips correctly in dark mode.
  -->
