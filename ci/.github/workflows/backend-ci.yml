name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", "ci/.github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api_gateway
          - user_service
          - doctor_service
          - nurse_service
          - hospital_service
          - booking_service
          - payment_service
          - telemedicine_service
          - notification_service
          - lab_service
          - ehr_service
          - social_service
          - analytics_service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          uv pip install --system ./backend/shared
          uv pip install --system ./backend/services/${{ matrix.service }}
          uv pip install --system pytest httpx
      - name: Lint
        run: uv run ruff check backend/services/${{ matrix.service }}
      - name: Test
        working-directory: backend/services/${{ matrix.service }}
        run: pytest -q
