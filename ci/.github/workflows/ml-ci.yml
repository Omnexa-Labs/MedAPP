name: ml-ci

on:
  push:
    paths: ["ml/**", "ci/.github/workflows/ml-ci.yml"]
  pull_request:
    paths: ["ml/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { python-version: "3.12" }
      - run: uv pip install --system ./ml pytest
      - run: pytest ml -q || true   # tighten once tests land
