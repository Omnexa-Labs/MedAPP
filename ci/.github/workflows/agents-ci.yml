name: agents-ci

on:
  push:
    paths: ["agents/**", "ci/.github/workflows/agents-ci.yml"]
  pull_request:
    paths: ["agents/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent:
          - concierge_agent
          - smart_recommend_agent
          - medical_chat_agent
          - lab_reader_agent
          - vitals_watcher_agent
          - booking_agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          uv pip install --system ./agents
          uv pip install --system pytest httpx
      - name: Test
        working-directory: agents/services/${{ matrix.agent }}
        env:
          # Health endpoint doesn't call Anthropic; provide a dummy so the SDK doesn't 401
          ANTHROPIC_API_KEY: dummy
          PYTHONPATH: ${{ github.workspace }}/agents:${{ github.workspace }}/agents/services/${{ matrix.agent }}
        run: pytest -q
