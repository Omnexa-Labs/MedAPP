name: deploy

on:
  workflow_dispatch:
    inputs:
      env: { description: "Target env (dev/staging/prod)", required: true, default: "dev" }
      image_tag: { description: "Image tag to deploy", required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: medapp-${{ github.event.inputs.env }}
          location: europe-west1
      - name: Deploy Helm
        run: |
          helm upgrade --install medapp infra/helm/medapp \
            --namespace medapp-${{ github.event.inputs.env }} --create-namespace \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --wait --timeout 10m
