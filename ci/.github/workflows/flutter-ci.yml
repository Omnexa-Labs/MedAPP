name: flutter-ci

on:
  push:
    paths: ["frontend/mobile/**", "ci/.github/workflows/flutter-ci.yml"]
  pull_request:
    paths: ["frontend/mobile/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
