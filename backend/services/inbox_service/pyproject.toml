[project]
name = "inbox-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.9",
  "structlog>=24.1",
  "uvicorn[standard]>=0.30",
  # Multipart attachment upload (POST /v1/threads/{id}/attachments).
  # FastAPI does NOT pull this in itself: without it, importing a route that
  # declares `UploadFile`/`File(...)` raises at APP STARTUP with
  # "Form data requires 'python-multipart' to be installed" — the container
  # never becomes healthy. It is a hard runtime dependency of the route, not a
  # nicety.
  "python-multipart>=0.0.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"