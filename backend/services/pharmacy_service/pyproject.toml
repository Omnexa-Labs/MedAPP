[project]
name = "pharmacy-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "alembic>=1.13",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pillow>=12.3,<13",
  "medapp-shared",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
medapp-shared = { path = "../../shared", editable = true }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
